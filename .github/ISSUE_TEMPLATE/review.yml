name: Revisar entrada
description: Actualizar una evaluación.
title: "[Revisión]: "
labels: ["catalog", "review"]
body:
  - type: input
    id: name
    attributes:
      label: Entrada
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit o release
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Hallazgos
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verificación reproducible
      description: Comandos, resultado de instalación/tests/build, licencia y riesgos.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Resultado propuesto
      options:
        - Mantener
        - Promover delivery status
        - Degradar delivery status
        - Cambiar decision status
        - Deprecar
    validations:
      required: true
  - type: textarea
    id: projects
    attributes:
      label: Impacto en Recipes y proyectos
      description: Qué cambia, cómo se actualiza y cómo se revierte.
    validations:
      required: true
