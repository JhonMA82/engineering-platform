name: Feature Pack
description: Propose a reusable optional capability
title: "[Feature Pack]: "
labels: ["platform", "feature-pack"]
body:
  - type: input
    id: name
    attributes: {label: Capability}
    validations: {required: true}
  - type: textarea
    id: reuse
    attributes: {label: Reuse evidence}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Dependencies, security and upgrade impact}
    validations: {required: true}
